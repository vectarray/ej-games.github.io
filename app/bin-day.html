        .bin-day-card {

	<script src="/minimalscript.js"></script>
	<script src="/frequent-notifications.js"></script>
	<script>
        const baseline = new Date(2026, 7, 26, 10, 0);

        const dates = {
            "general-waste": 3,
            "recycling": 2,
            "food-waste": 1
        }

        function onLoad() {
            for(var child of document.getElementById("bin-days").children) {
                console.log(child.id);
                var nextDay = new Date(baseline.valueOf());
                while(nextDay <= Date.now()) {
                    nextDay.setDate(nextDay.getDate() + (dates[child.id] * 7));
                }
                console.log(nextDay);
                if(nextDay - Date.now() <= (1000 * 3600 * 24 * 7)) {
                    console.log("Take this bin out!");
                    child.classList.add("yes");
                    child.getElementsByTagName("p")[0].innerHTML = "DO take this bin out today.";
                }
                else {
                    var options = {
                        month: "short",
                        day: "numeric"
                    }
                    var daysBetween = new Date(nextDay - Date.now()).getDate();
                    child.getElementsByTagName("p")[0].innerHTML = String.raw`Do NOT take this bin out today.<br><br>Take it out on ${nextDay.toLocaleString("en-GB", options)}, in ${daysBetween} days.`;
                }
            }
        }
    </script>
